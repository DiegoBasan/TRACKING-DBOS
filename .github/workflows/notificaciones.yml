name: Notificaciones

on:
  schedule:
    - cron: '13 * * * *'   # cada hora (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:
    inputs:
      modo:
        description: 'auto = lo normal · prueba = manda un aviso de prueba a todos los dispositivos'
        type: choice
        options: [auto, prueba]
        default: prueba

concurrency: notificaciones

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP_URL: https://diegobasan.github.io/TRACKING-DBOS/
          TZ_APP: America/Chihuahua
          MODO: ${{ github.event.inputs.modo || 'auto' }}
