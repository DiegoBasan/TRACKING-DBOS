<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ececec" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<title>Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script>
/* Tema antes de pintar para evitar parpadeo */
(function(){var m='auto';try{m=localStorage.getItem('tracker-theme')||'auto'}catch(e){}
var d=m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
document.documentElement.dataset.theme=d?'dark':'light';})();
</script>
<style>
:root{
  --bg:#ececec; --card:#fff; --soft:#f4f4f4; --soft2:#e9e9e9; --line:#e6e6e6;
  --ink:#141414; --ink2:#3d3d3d; --mut:#8b8b8b; --mut2:#bdbdbd; --inv:#fff;
  --red:#e5262f; --redBg:#fde9ea;
  --glass:rgba(250,250,250,.58); --glassEdge:rgba(255,255,255,.75); --glassHi:rgba(255,255,255,.95); --glassSel:rgba(0,0,0,.07);
  --shadow:0 10px 30px rgba(0,0,0,.13),0 1px 3px rgba(0,0,0,.06);
  --r:26px; --font:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
}
[data-theme=dark]{
  --bg:#0a0a0a; --card:#161616; --soft:#1e1e1e; --soft2:#262626; --line:#242424;
  --ink:#f0f0f0; --ink2:#c9c9c9; --mut:#858585; --mut2:#454545; --inv:#0a0a0a;
  --red:#ff4d55; --redBg:#3a1517;
  --glass:rgba(38,38,38,.55); --glassEdge:rgba(255,255,255,.13); --glassHi:rgba(255,255,255,.2); --glassSel:rgba(255,255,255,.12);
  --shadow:0 10px 30px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;transition:background .2s}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{max-width:560px;margin:0 auto;padding:0 12px 130px}
.noselect,[data-lp]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

/* ---- Liquid glass (CSS: funciona en Safari) ---- */
.glass{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.04);backdrop-filter:blur(16px) saturate(190%) brightness(1.04);
  box-shadow:var(--shadow),inset 0 0 0 .6px var(--glassEdge),inset 0 1.2px 1px var(--glassHi),inset 0 -1px 2px rgba(255,255,255,.12)}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(120% 70% at 25% 0%,rgba(255,255,255,.38),rgba(255,255,255,0) 60%),linear-gradient(180deg,rgba(255,255,255,0) 60%,rgba(255,255,255,.12))}
[data-theme=dark] .glass::before{background:radial-gradient(120% 70% at 25% 0%,rgba(255,255,255,.12),rgba(255,255,255,0) 60%)}

/* Header */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 4px 10px;background:linear-gradient(var(--bg) 72%,transparent)}
.rnd{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
header .rnd svg{width:19px;height:19px}
header h1{flex:1;margin:0 0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.5px}
.sync{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-weight:600}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut2);display:block}
.sync.on i{background:#22a35a}
.sync.busy i{background:var(--ink);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px}

/* Calendario */
.mhead{display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px}
.mhead b{font-size:16px;font-weight:800;text-transform:capitalize}
.mhead .nav{display:flex;gap:6px}
.mhead .nav button{width:32px;height:32px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.mhead .nav svg{width:17px;height:17px}
.mhead .today{padding:0 12px;width:auto!important;border-radius:20px!important;font-size:12px;font-weight:700}
.cal{background:var(--soft);border-radius:20px;overflow:hidden}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mut);text-align:center;padding:9px 0 6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);column-gap:2px;row-gap:2px;padding:0 2px 2px}
.day{grid-row:1/-1;background:var(--card);border-radius:10px;display:flex;justify-content:center;align-items:flex-start;padding-top:5px;font-weight:700;font-size:13px;color:var(--ink);border:2px solid transparent;min-height:74px}
.day.out{background:color-mix(in srgb,var(--card) 55%,var(--soft));color:var(--mut2)}
.day.sel{border-color:var(--ink)}
.day .n{width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.tod .n{background:var(--ink);color:var(--inv)}
.bar{z-index:2;position:relative;align-self:center;height:17px;line-height:17px;margin:0 1px;padding:0 4px;font-size:9.5px;font-weight:700;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;cursor:pointer;min-width:0;transition:transform .15s}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:-2px}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:-2px}
.bar .wm{position:absolute;right:3px;top:3px;width:11px;height:11px;opacity:.5;pointer-events:none}
.bar .tx{position:relative}
.more{z-index:2;font-size:9.5px;font-weight:700;color:var(--mut);text-align:center;align-self:center;pointer-events:none}

/* Estados por categoría: pendiente = opaco, en curso = color lleno, completada = tachado y opaco */
.cn{background:color-mix(in srgb,var(--c) 17%,var(--card));color:color-mix(in srgb,var(--c) 78%,var(--ink))}
.cp{background:var(--c);color:#fff}
.cd{background:color-mix(in srgb,var(--c) 9%,var(--card));color:var(--mut);text-decoration:line-through;text-decoration-thickness:1.5px}
.cd .wm,.ico.cd svg{opacity:.45}
.pressing{transform:scale(.94)}

/* Panel del día / filas */
.dp h2{margin:2px 2px 0;font-size:20px;font-weight:800;letter-spacing:-.4px}
.dp .sub{margin:0 2px 6px;color:var(--mut);font-size:12.5px}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-of-type{border-bottom:0}
.ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:none;text-decoration:none!important}
.ico svg{width:18px;height:18px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:14.5px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--mut);font-size:11.5px}
.row.isdone .t b{color:var(--mut);text-decoration:line-through}
.mini{height:4px;border-radius:4px;background:var(--soft2);margin-top:6px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);border-radius:4px}
.pill{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap}
.pill.prog{background:var(--ink);color:var(--inv)}
.pill.done{background:var(--soft2);color:var(--ink2)}
.pill.late{background:var(--redBg);color:var(--red)}
.dash{width:100%;margin-top:10px;border:1.8px dashed var(--mut2);border-radius:18px;padding:13px;font-weight:700;font-size:14px;display:flex;justify-content:center;align-items:center;gap:8px;color:var(--ink2)}
.empty{color:var(--mut);text-align:center;padding:16px 0 6px;font-size:13px}

/* Lista */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:30px;padding:5px 5px 5px 14px;margin-bottom:10px}
.search input{flex:1;border:0;outline:0;background:none;font-size:14px;min-width:0}
.search .fbtn{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--inv);display:grid;place-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 13px;border-radius:20px;background:var(--card);font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--ink2);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--inv)}
.chip .dt{width:9px;height:9px;border-radius:50%;background:var(--c)}
.sect{display:flex;justify-content:space-between;align-items:center;margin:12px 6px 8px;font-size:14.5px;font-weight:800}
.sect small{color:var(--mut);font-weight:600;font-size:12px}
.scard{background:var(--card);border-radius:22px;padding:2px 12px;margin-bottom:10px}

/* Tracker compacto */
.tc{background:var(--card);border-radius:22px;padding:12px 12px 8px;margin-bottom:10px}
.tch{display:flex;align-items:center;gap:11px;cursor:pointer}
.tch .t{flex:1;min-width:0}
.tch b{display:block;font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tch small{color:var(--mut);font-size:11.5px}
.tbar{height:4px;border-radius:4px;background:var(--soft2);margin:10px 2px 6px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--c);border-radius:4px;transition:width .35s}
.ts{display:flex;align-items:center;gap:10px;width:100%;padding:8px 4px;border-radius:12px;text-align:left}
.ts:active{background:var(--soft)}
.ts .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--mut2);display:grid;place-items:center;flex:none;transition:.15s}
.ts .ck svg{width:11px;height:11px;stroke-width:3.2;color:#fff;opacity:0}
.ts.ok .ck{background:var(--c);border-color:var(--c)}
.ts.ok .ck svg{opacity:1}
.ts .tt{flex:1;font-size:13.5px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ts.ok .tt{color:var(--mut);text-decoration:line-through}
.ts .td{font-size:11px;color:var(--mut);font-weight:600}

/* Stepper (detalle) */
.stp{position:relative;height:24px;margin:0 2px}
.stp .ln{position:absolute;left:11px;right:11px;top:10px;height:4px;border-radius:4px;background:var(--soft2)}
.stp .ln i{display:block;height:100%;background:var(--c,var(--ink));border-radius:4px;transition:width .4s}
.nd{position:absolute;top:0;width:24px;height:24px;border-radius:50%;background:var(--mut2);display:grid;place-items:center}
.nd.ok{background:var(--c,var(--ink));box-shadow:0 0 0 2px var(--bg) inset}
.nd.ok svg{color:#fff;width:12px;height:12px;stroke-width:3}
.nd.cur{background:var(--bg);border:3px solid var(--c,var(--ink))}
.nd.cur::after{content:'';width:8px;height:8px;border-radius:50%;background:var(--c,var(--ink))}
.stl{position:relative;height:34px;margin:7px 2px 0}
.lb{position:absolute;top:0;font-size:11.5px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb small{display:block;font-size:10.5px;font-weight:600;color:var(--mut)}
.lb.pend{color:var(--mut)}

/* Dock flotante estilo iOS 26 */
.dock{position:fixed;left:0;right:0;bottom:max(12px,calc(env(safe-area-inset-bottom) - 10px));z-index:30;display:flex;justify-content:space-between;align-items:center;padding:0 20px;pointer-events:none;max-width:560px;margin:0 auto}
.tabs{pointer-events:auto;display:flex;padding:4px;border-radius:32px;height:62px;gap:0}
.tabs button{position:relative;z-index:1;width:92px;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);font-size:10px;font-weight:600;transition:color .2s,transform .2s}
.tabs button svg{width:23px;height:23px;stroke-width:1.9}
.tabs button.on{color:var(--ink)}
.tabs button.on svg{stroke-width:2.3}
.tabs button:active{transform:scale(.92)}
.tpill{position:absolute;z-index:0;top:4px;left:4px;width:92px;height:54px;border-radius:27px;background:var(--glassSel);transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.fab{pointer-events:auto;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:var(--ink);transition:transform .2s}
.fab svg{width:26px;height:26px;stroke-width:2.2}
.fab:active{transform:scale(.9)}

/* Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,105%);z-index:60;background:var(--bg);border-radius:28px 28px 0 0;max-height:93vh;overflow-y:auto;transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 14px calc(30px + env(safe-area-inset-bottom))}
.sheet.show{transform:translate(-50%,0)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--mut2);margin:2px auto 8px}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.shead h3{margin:0;font-size:16px;font-weight:800}
.shead .rnd{width:40px;height:40px;background:var(--card)}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.hero .ico{width:48px;height:48px;border-radius:15px}
.hero .ico svg{width:24px;height:24px}
.hero .t{flex:1;min-width:0}
.hero .t b{display:block;font-size:18px;font-weight:800;line-height:1.2}
.lbl{font-size:11.5px;color:var(--mut);font-weight:600}
.big{width:100%;height:52px;border-radius:17px;background:var(--ink);color:var(--inv);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 12px}
.big.ghost{background:var(--card);color:var(--ink)}
.dcard{background:var(--soft);border-radius:22px;padding:12px 7px 7px}
.dcard .h{display:flex;gap:9px;align-items:center;color:var(--mut);font-weight:600;padding:0 8px 10px;font-size:13px}
.dcard .h svg{width:18px;height:18px}
.dcard .in{background:var(--card);border-radius:16px;padding:4px 14px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;font-size:13.5px}
.kv span{color:var(--ink2)}
.kv b{font-weight:700;text-align:right;display:flex;align-items:center;gap:6px}
.kv .dt{width:9px;height:9px;border-radius:50%;background:var(--c)}
.tl{background:var(--card);border-radius:22px;padding:8px 14px;margin-top:12px}
.tli{display:grid;grid-template-columns:64px 26px 1fr;gap:8px;padding:10px 0;align-items:start;cursor:pointer;position:relative}
.tli .tm{font-weight:700;font-size:13px}
.tli .tm small{display:block;color:var(--mut);font-size:10.5px;font-weight:600}
.tli .ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut2);display:grid;place-items:center;background:var(--card);position:relative;z-index:1}
.tli.ok .ck{background:var(--c,var(--ink));border-color:var(--c,var(--ink))}
.tli.ok .ck svg{color:#fff;width:12px;height:12px;stroke-width:3}
.tli .tx{font-size:13.5px;line-height:1.35;padding-top:1px}
.tli.ok .tx b{color:var(--mut);text-decoration:line-through}
.tli:not(:last-child)::before{content:'';position:absolute;left:82px;top:34px;bottom:-10px;border-left:2px dotted var(--mut2)}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1;height:46px;border-radius:15px;background:var(--card);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.acts .del{color:var(--red)}
.acts .del.arm{background:var(--red);color:#fff}

/* Formulario */
.f{display:block;margin-bottom:12px}
.f>span,.flbl{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin:0 0 6px 4px}
.f input,.f select,.f textarea{width:100%;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:12px 13px;outline:0;font-size:15px}
.f input:focus,.f textarea:focus{border-color:var(--ink)}
.ttl-in{font-size:17px!important;font-weight:700}
.det{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mut);margin:6px 4px 0;font-weight:600}
.det .dt{width:8px;height:8px;border-radius:50%;background:var(--c)}
.det svg{width:13px;height:13px;color:var(--c)}
.seg{display:flex;background:var(--soft2);border-radius:15px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-weight:700;font-size:13px;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{width:17px;height:17px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stg{display:grid;grid-template-columns:28px 1fr 118px 30px;gap:6px;align-items:center;margin-bottom:7px}
.stg input{background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:10px;outline:0;min-width:0;font-size:14px}
.stg input[type=date]{font-size:12.5px;padding:9px 6px}
.stg .ckb{width:26px;height:26px;border-radius:50%;border:2px solid var(--mut2);background:var(--card);display:grid;place-items:center}
.stg .ckb.ok{background:var(--ink);border-color:var(--ink);color:var(--inv)}
.stg .ckb svg{width:12px;height:12px;stroke-width:3}
.stg .rm{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--mut)}
.addst{width:100%;padding:11px;border-radius:14px;border:1.8px dashed var(--mut2);font-weight:700;display:flex;justify-content:center;gap:6px;margin-bottom:6px}

/* Rueda de estado (desliza ↑↓) */
.strow{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:8px 8px 8px 14px;margin-bottom:12px}
.strow .lb2{flex:1;font-size:13px;font-weight:700}
.strow .lb2 small{display:block;color:var(--mut);font-weight:600;font-size:11px;margin-top:2px}
.wheel{height:78px;width:136px;overflow:hidden;position:relative;touch-action:none;border-radius:14px;background:var(--soft);cursor:ns-resize;
  -webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel.dis{opacity:.5;pointer-events:none}
.wt{position:absolute;left:0;right:0;top:0;transition:transform .3s cubic-bezier(.25,1.3,.4,1)}
.wi{height:28px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:13px;opacity:.4;transform:scale(.86);transition:.2s}
.wi.on{opacity:1;transform:scale(1)}
.wi i{width:8px;height:8px;border-radius:50%;border:2px solid currentColor}
.wi.s1 i{background:currentColor;opacity:.5}
.wi.s2 i{background:currentColor}

/* Mini calendario */
.mc{background:var(--card);border-radius:20px;padding:10px 10px 8px;margin-bottom:12px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wheel,.tabs,.fab,.ts{-webkit-user-select:none;user-select:none}
.mch{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.mch b{font-size:14px;font-weight:800;text-transform:capitalize}
.mch button{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.mch svg{width:16px;height:16px}
.mcw,.mcg{display:grid;grid-template-columns:repeat(7,1fr)}
.mcw{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--mut);text-align:center;padding-bottom:4px}
.mcg{touch-action:none;row-gap:3px}
.mcd{height:36px;display:grid;place-items:center;font-size:13.5px;font-weight:700;position:relative}
.mcd.out{color:var(--mut2)}
.mcd.tod span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.mcd.rm{background:var(--soft2)}
.mcd.rs,.mcd.re{background:var(--soft2)}
.mcd.rs{border-radius:12px 0 0 12px}.mcd.re{border-radius:0 12px 12px 0}.mcd.rs.re{border-radius:12px}
.mcd.rs span,.mcd.re span{background:var(--ink);color:var(--inv);width:32px;height:32px;border-radius:10px;display:grid;place-items:center}
.mcs{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;padding:8px 4px 2px}
.mcs small{color:var(--mut);font-weight:600;font-size:11px}

/* Selector de categoría / icono */
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats .chip{background:var(--card)}
.cats .chip.on{background:var(--c);color:#fff}
.cats .chip.on .dt{background:#fff}
.ipick{background:var(--card);border-radius:18px;margin-bottom:12px;overflow:hidden}
.iph{display:flex;align-items:center;gap:10px;padding:10px 12px;width:100%;text-align:left}
.iph .ico{width:32px;height:32px;border-radius:10px}
.iph .t{flex:1;font-size:13px;font-weight:700}
.iph .t small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.igrid{padding:0 10px 10px}
.igrp{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.5px;margin:8px 2px 5px}
.igl{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:5px}
.igl button{height:40px;border-radius:11px;background:var(--soft);display:grid;place-items:center;color:var(--ink2)}
.igl button svg{width:20px;height:20px}
.igl button.on{background:var(--c);color:#fff}

/* Burbuja de estado (mantener presionado) */
.lpb{position:fixed;z-index:85;width:186px;border-radius:22px;padding:5px;transform-origin:50% 100%;animation:pop .22s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.lpi{height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:17px;font-weight:700;font-size:14px;transition:background .12s,color .12s}
.lpi .d{width:12px;height:12px;border-radius:50%;border:2px solid currentColor}
.lpi.s1 .d{background:currentColor;opacity:.5}.lpi.s2 .d{background:currentColor}
.lpi.on{background:var(--ink);color:var(--inv)}
.lpt{font-size:11px;font-weight:700;color:var(--mut);padding:6px 12px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lpov{position:fixed;inset:0;z-index:84;background:rgba(0,0,0,.12)}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-120px);background:var(--ink);color:var(--inv);padding:10px 16px;border-radius:30px;font-weight:600;font-size:13px;z-index:90;transition:.25s;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg small{display:block;color:var(--mut);font-size:11.5px;margin-top:2px}
.sw{position:relative;width:48px;height:29px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:30px;background:var(--mut2);transition:.2s}
.sw i::after{content:'';position:absolute;left:3px;top:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw input:checked+i{background:var(--ink)}
[data-theme=dark] .sw input:checked+i::after{background:#111}
.sw input:checked+i::after{transform:translateX(19px)}
.tg select{border:0;background:var(--soft);border-radius:10px;padding:7px 9px;font-weight:700}
.note{font-size:12px;color:var(--mut);line-height:1.45;margin:10px 4px 0}
</style>
</head>

function ingest(docs){
  ACTS=docs.filter(a=>a&&a.id&&a.inicio).map(a=>{const o={};FIELDS.forEach(k=>o[k]=a[k]??'');o.tipo=o.tipo||'simple';o.estado=o.estado||'Pendiente';o.fin=o.fin||o.inicio;return o});

  docs.forEach(a=>(a.etapas||[]).forEach((e,i)=>STAGES.push({...e,actividadId:a.id,orden:i+1,completada:!!e.completada})));
}

function status(a){
  if(isTrk(a)){const{d,n}=prog(a);if(n){if(d===n)return'Completada';if(d>0)return'En curso';}}
  return a.estado;
}

/* Guardar */
function saveAct(a,st,reopen,silent){
  const i=ACTS.findIndex(x=>x.id===a.id);if(i>=0)ACTS[i]=a;else ACTS.push(a);
  STAGES=STAGES.filter(s=>s.actividadId!==a.id).concat(st.map((s,k)=>({...s,actividadId:a.id,orden:k+1})));
  render();if(reopen)openDetail(reopen);
  const doc={};FIELDS.forEach(k=>doc[k]=a[k]??'');
  doc.etapas=st.map((s,k)=>({id:s.id||a.id+'-'+(k+1)+'-'+Math.random().toString(36).slice(2,6),titulo:s.titulo,fecha:s.fecha||'',completada:!!s.completada,completadaEn:s.completadaEn||''}));
  doc.actualizado=TS();
  if(!silent)toast('Guardado');
  return COL.doc(a.id).set(doc).catch(e=>toast('Error al guardar: '+e.message));
}
/* Cambiar estado (también para actividades con avances) */
function setState(a,s,reopen){
  if(status(a)===s)return;
  let st=stOf(a.id).map(x=>({...x}));
  if(isTrk(a)&&st.length){
    if(s==='Completada')st.forEach(x=>{if(!x.completada){x.completada=true;x.completadaEn=TODAY}});
    else if(s==='Pendiente')st.forEach(x=>{x.completada=false;x.completadaEn=''});
    else{const d=st.filter(x=>x.completada).length;
      if(d===0){st[0].completada=true;st[0].completadaEn=TODAY}
      else if(d===st.length){const l=st[st.length-1];l.completada=false;l.completadaEn=''}}
    saveAct({...a,estado:autoEstado(st)},st,reopen,true);
  }else saveAct({...a,estado:s},st,reopen,true);
  toast(s==='Completada'?'Completada ✓':s);
}
function toggleStage(id,i){
  const a=ACTS.find(x=>x.id===id);if(!a)return;
  const st=stOf(id).map(x=>({...x}));const x=st[i];if(!x)return;
  x.completada=!x.completada;x.completadaEn=x.completada?TODAY:'';
  saveAct({...a,estado:autoEstado(st)},st,null,true);
}

/* =========================================================
   STEPPER (detalle)
   ========================================================= */
function stepper(a){
  const{st,n}=prog(a);if(!n)return'';
  let last=-1;st.forEach((s,i)=>{if(s.completada)last=i});
  const cur=st.findIndex(s=>!s.completada);
  const pos=i=>n===1?0:i/(n-1)*100;
  const fill=n===1?(last>=0?100:0):last<0?0:Math.min(100,(last+(last<n-1?.4:0))/(n-1)*100);
  let nodes='',labels='';
  st.forEach((s,i)=>{
    const p=pos(i),cls=s.completada?'ok':i===cur?'cur':'';
    nodes+=`<div class="nd ${cls}" style="left:${p}%;transform:translateX(-${p}%)">${s.completada?ic('check'):''}</div>`;
  });
  const set=new Set(n<=3?st.map((_,i)=>i):[0,n-1,cur<0?n-1:cur,last].filter(i=>i>=0));
  const idx=[...set].sort((a,b)=>a-b);
  idx.forEach((i,k)=>{
    const s=st[i],p=pos(i)/100;
    const lo=k?(p+pos(idx[k-1])/100)/2:0, hi=k<idx.length-1?(p+pos(idx[k+1])/100)/2:1;
    let place;
    if(n===1||p===0) place=`left:0;width:calc(13px + (100% - 26px) * ${hi} - 4px);text-align:left`;
    else if(p===1) place=`right:0;width:calc(13px + (100% - 26px) * ${1-lo} - 4px);text-align:right`;
    else{const h=Math.min(p-lo,hi-p);place=`left:calc(13px + (100% - 26px) * ${p-h} + 2px);width:calc((100% - 26px) * ${2*h} - 4px);text-align:center`;}
    const sub=s.completada&&s.completadaEn?'✓ '+sh(s.completadaEn):sh(s.fecha);
    labels+=`<div class="lb ${s.completada||i===cur?'':'pend'}" style="${place}">${esc(s.titulo)}<small>${sub}</small></div>`;
  });
  return`<div class="stp"><div class="ln"><i style="width:${fill}%"></i></div>${nodes}</div><div class="stl">${labels}</div>`;
}

function calView(){
  const m=S.month,first=new Date(m.getFullYear(),m.getMonth(),1),lastD=new Date(m.getFullYear(),m.getMonth()+1,0);
  const start=addD(first,-((first.getDay()+6)%7));
  const end=addD(lastD,(7-lastD.getDay())%7);
  let weeks='';
  for(let ws=start;ws<=end;ws=addD(ws,7)){
    const wsS=Y(ws),weS=Y(addD(ws,6));
    const ev=ACTS.filter(a=>a.inicio&&a.inicio<=weS&&a.fin>=wsS)
      .sort((a,b)=>a.inicio.localeCompare(b.inicio)||dd(b.inicio,b.fin)-dd(a.inicio,a.fin)||a.titulo.localeCompare(b.titulo));
    const lanes=[],segs=[],MAXL=4,hidden=Array(7).fill(0);
    ev.forEach(a=>{
      const c0=Math.max(0,dd(wsS,a.inicio)),c1=Math.min(6,dd(wsS,a.fin));
      let l=lanes.findIndex(e=>e<c0);if(l<0){l=lanes.length;lanes.push(-1)}lanes[l]=c1;
      if(l<MAXL)segs.push({a,c0,c1,l,cl:a.inicio<wsS,cr:a.fin>weS});
      else for(let c=c0;c<=c1;c++)hidden[c]++;
    });
    const used=Math.min(lanes.length,MAXL),hasMore=hidden.some(Boolean),rows=Math.max(2,used+(hasMore?1:0));
    let h=`<div class="week" style="grid-template-rows:30px repeat(${rows},17px) 5px">`;
    for(let i=0;i<7;i++){
      const d=addD(ws,i),ds=Y(d);
      h+=`<button class="day ${d.getMonth()!==m.getMonth()?'out':''} ${ds===TODAY?'tod':''} ${ds===S.sel?'sel':''}" style="grid-column:${i+1}" data-day="${ds}"><span class="n">${d.getDate()}</span></button>`;
    }
    segs.forEach(({a,c0,c1,l,cl,cr})=>{
      const span=c1-c0+1;
      h+=`<div class="bar ${stCls(status(a))} ${cl?'cl':''} ${cr?'cr':''}" style="--c:${colorOf(a)};grid-column:${c0+1}/${c1+2};grid-row:${l+2}" data-lp="${esc(a.id)}">${span>=2?ic(iconOf(a),'wm'):''}<span class="tx">${esc(a.titulo)}</span></div>`;
    });
    hidden.forEach((n,c)=>{if(n)h+=`<div class="more" style="grid-column:${c+1};grid-row:${used+2}">+${n}</div>`});
    weeks+=h+'</div>';
  }
  return`<div class="card">
    <div class="mhead"><b>${MES[m.getMonth()]} ${m.getFullYear()}</b>

    <div class="cal"><div class="dow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>${weeks}</div>
  </div>${dayPanel()}`;
}
function dayPanel(){
  const d=P(S.sel);
  const list=ACTS.filter(a=>a.inicio<=S.sel&&a.fin>=S.sel).sort((a,b)=>(status(a)==='Completada')-(status(b)==='Completada')||a.inicio.localeCompare(b.inicio));

function rowHTML(a){

/* =========================================================
   MANTENER PRESIONADO → BURBUJA DE ESTADO
   Toca = abrir detalle · Mantén = burbuja · Desliza ↑/↓ y suelta = cambia estado
   ========================================================= */
const LP_ORDER=['Completada','En curso','Pendiente'];  // de arriba a abajo: arriba = avanzar
let LP=null;
function bindLP(el){
  el.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    LP={el,id:el.dataset.lp,x0:e.clientX,y0:e.clientY,active:false,timer:setTimeout(lpActivate,360)};
    el.classList.add('pressing');
  });
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
function lpCancel(){if(!LP)return;clearTimeout(LP.timer);LP.el.classList.remove('pressing');LP=null}
function lpActivate(){
  if(!LP)return;
  const a=ACTS.find(x=>x.id===LP.id);if(!a){lpCancel();return}
  LP.active=true;LP.a=a;
  navigator.vibrate?.(12);
  const cur=LP_ORDER.indexOf(status(a));LP.cur=cur;LP.sel=cur;
  const ov=document.createElement('div');ov.className='lpov';
  const b=document.createElement('div');b.className='lpb glass';
  b.innerHTML=`<div class="lpt">${esc(a.titulo)}</div>`+LP_ORDER.map((s,i)=>`<div class="lpi s${2-i} ${i===cur?'on':''}"><span class="d"></span>${s}</div>`).join('');
  document.body.append(ov,b);
  const h=b.offsetHeight,w=b.offsetWidth;
  const itemY=30+cur*44+22; // centro del ítem actual dentro de la burbuja
  let top=LP.y0-70-itemY; top=Math.max(10+(window.visualViewport?.offsetTop||0),Math.min(top,innerHeight-h-10));
  let left=Math.max(10,Math.min(LP.x0-w/2,innerWidth-w-10));
  b.style.top=top+'px';b.style.left=left+'px';
  LP.bub=b;LP.ov=ov;
}
function lpMove(e){
  if(!LP)return;
  const dx=e.clientX-LP.x0,dy=e.clientY-LP.y0;
  if(!LP.active){if(Math.hypot(dx,dy)>9)lpCancel();return}
  const sel=Math.max(0,Math.min(2,LP.cur+Math.round(dy/40)));
  if(sel!==LP.sel){LP.sel=sel;navigator.vibrate?.(6);LP.bub.querySelectorAll('.lpi').forEach((x,i)=>x.classList.toggle('on',i===sel))}
}
function lpEnd(e){
  if(!LP)return;
  const L=LP;clearTimeout(L.timer);L.el.classList.remove('pressing');LP=null;
  if(L.active){
    L.bub.remove();L.ov.remove();
    if(L.sel!==L.cur)setState(L.a,LP_ORDER[L.sel]);
  }else if(e.type==='pointerup'&&Math.hypot(e.clientX-L.x0,e.clientY-L.y0)<9)openDetail(L.id);
}
document.addEventListener('pointermove',lpMove,{passive:true});
document.addEventListener('pointerup',lpEnd);
document.addEventListener('pointercancel',e=>{if(LP&&LP.active)return;lpCancel()});
document.addEventListener('touchmove',e=>{if(LP&&LP.active)e.preventDefault()},{passive:false});

/* Rueda de estado: desliza ↑ = avanzar, ↓ = regresar, toca = siguiente */
function wheel(el,idx,onChange){
  const track=el.querySelector('.wt'),items=[...el.querySelectorAll('.wi')],H=28,C=25;
  let i=Math.max(0,idx),y0=null,moved=false;
  const set=(n,anim=true)=>{i=Math.max(0,Math.min(items.length-1,n));track.style.transition=anim?'':'none';track.style.transform=`translateY(${C-i*H}px)`;items.forEach((x,k)=>x.classList.toggle('on',k===i))};
  set(i,false);
  el.addEventListener('pointerdown',e=>{y0=e.clientY;moved=false;el.setPointerCapture(e.pointerId);track.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(y0==null)return;const dy=e.clientY-y0;if(Math.abs(dy)>4)moved=true;track.style.transform=`translateY(${C-i*H+dy}px)`});
  const up=e=>{if(y0==null)return;const dy=e.clientY-y0;y0=null;
    const n=moved?i-Math.round(dy/H):(i+1)%items.length;
    if(n!==i)navigator.vibrate?.(8);set(n);onChange(i)};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}

/* Mini calendario: toca inicio y fin (o un solo día) · mantén y desliza para extender */
function miniCal(el,pk){
  const draw=()=>{
    const m=pk.m,first=new Date(m.getFullYear(),m.getMonth(),1),lastD=new Date(m.getFullYear(),m.getMonth()+1,0);
    const start=addD(first,-((first.getDay()+6)%7)),end=addD(lastD,(7-lastD.getDay())%7);
    let cells='';for(let d=start;d<=end;d=addD(d,1)){const ds=Y(d);cells+=`<div class="mcd ${d.getMonth()!==m.getMonth()?'out':''} ${ds===TODAY?'tod':''}" data-d="${ds}"><span>${d.getDate()}</span></div>`}
    el.innerHTML=`<div class="mch"><button data-mm="-1">${ic('left')}</button><b>${MES[m.getMonth()]} ${m.getFullYear()}</b><button data-mm="1">${ic('right')}</button></div>
      <div class="mcw"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div class="mcg">${cells}</div><div class="mcs" id="mcs"></div>`;
    el.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{pk.m=new Date(pk.m.getFullYear(),pk.m.getMonth()+Number(b.dataset.mm),1);draw()});
    bind();paint();
  };
  const paint=()=>{
    el.querySelectorAll('[data-d]').forEach(c=>{const d=c.dataset.d;c.classList.toggle('rs',d===pk.s);c.classList.toggle('re',d===pk.e);c.classList.toggle('rm',d>pk.s&&d<pk.e)});
    const n=dd(pk.s,pk.e)+1,d=P(pk.s);
    $('mcs').innerHTML=n===1?`<span>${DIAS[d.getDay()]} ${d.getDate()} de ${MES[d.getMonth()]}</span><small>${pk.pending?'Toca otro día para el fin':'Solo este día'}</small>`
      :`<span>${sh(pk.s)} → ${sh(pk.e)}</span><small>${n} días</small>`;
  };
  const bind=()=>{
    const g=el.querySelector('.mcg');let drag=null;
    g.addEventListener('pointerdown',e=>{const c=e.target.closest('[data-d]');if(!c)return;drag={anchor:c.dataset.d,moved:false};g.setPointerCapture(e.pointerId)});
    g.addEventListener('pointermove',e=>{if(!drag)return;const c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.mcd');if(!c||!g.contains(c))return;const d=c.dataset.d;
      if(d!==drag.anchor||drag.moved){if(!drag.moved)navigator.vibrate?.(8);drag.moved=true;pk.s=d<drag.anchor?d:drag.anchor;pk.e=d<drag.anchor?drag.anchor:d;pk.pending=false;paint()}});
    const up=()=>{if(!drag)return;const d=drag.anchor;
      if(!drag.moved){
        if(!pk.pending){pk.s=pk.e=d;pk.pending=true}
        else{if(d<pk.s){pk.e=pk.s;pk.s=d}else pk.e=d;pk.pending=false}
        paint();
      }drag=null};
    g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
  };
  draw();
}

/* =========================================================
   NOTIFICACIONES (Firebase Cloud Messaging)
   ========================================================= */
const VAPID_DEFAULT='BBsqk9d9k3AmZ4FpB21-aIFriFzMkohRAcRKw0mRTc7xpcZS8UGK2b74oFs4Z8HOWmyerZn4CpKj0TORdfftd0w';
let VAPID=VAPID_DEFAULT,DEVICE=null;
let DEVICE_ID;try{DEVICE_ID=localStorage.getItem('tracker-device')}catch(e){}
if(!DEVICE_ID){DEVICE_ID='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);try{localStorage.setItem('tracker-device',DEVICE_ID)}catch(e){}}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushSupported=()=>'Notification' in window&&'serviceWorker' in navigator&&'PushManager' in window;
let swReg=null;
async function getReg(){if(swReg)return swReg;swReg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;return swReg}
async function enablePush(){
  if(!pushSupported()){toast(isIOS&&!standalone?'Primero agrégala a la pantalla de inicio':'Este navegador no soporta notificaciones');return false}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){toast('Permiso de notificaciones denegado');return false}
  const reg=await getReg();
  const token=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
  const base={token,ua:navigator.userAgent.slice(0,160),actualizado:TS()};
  if(!DEVICE)Object.assign(base,{creado:TS(),resumen:true,horaResumen:8,recordatorios:true,nombre:isIOS?'iPhone':'Navegador'});
  await DEV.doc(DEVICE_ID).set(base,{merge:true});
  DEVICE={...(DEVICE||{resumen:true,horaResumen:8,recordatorios:true}),token};
  return true;
}
function setPref(k,v){DEVICE={...DEVICE,[k]:v};return DEV.doc(DEVICE_ID).set({[k]:v,actualizado:TS()},{merge:true}).catch(e=>toast('Error: '+e.message))}

/* =========================================================
   AJUSTES
   ========================================================= */
function openSettings(){
  const perm=pushSupported()?Notification.permission:'na';
  const on=perm==='granted'&&DEVICE&&DEVICE.token;
  let estado;
  if(!pushSupported())estado=isIOS&&!standalone?'En iPhone: Safari → Compartir → <b>Agregar a pantalla de inicio</b>, ábrela desde el ícono y vuelve aquí.':'Este navegador no soporta notificaciones push.';
  else if(perm==='denied')estado='<b style="color:var(--red)">Bloqueadas.</b> Actívalas en los ajustes del sistema para esta app.';
  else if(on)estado='<b>Activadas en este dispositivo.</b>';
  else estado='Recibe el resumen del día y recordatorios de entregas y avances.';
  const hours=Array.from({length:17},(_,i)=>i+5);
  openSheet(`
    <div class="shead"><button class="rnd" data-close>${ic('x')}</button><h3>Ajustes</h3><span style="width:40px"></span></div>
    <span class="flbl">Apariencia</span>
    <div class="seg">${[['auto','auto','Auto'],['light','sun','Claro'],['dark','moon','Oscuro']].map(([k,i,t])=>`<button data-th="${k}" class="${THEME===k?'on':''}">${ic(i)} ${t}</button>`).join('')}</div>
    <div class="dcard" style="margin-bottom:12px"><div class="h">${ic('bell')} Notificaciones</div><div class="in" style="padding:4px 14px">
      <div class="tg" style="display:block;line-height:1.45;color:var(--ink2)">${estado}</div>
      ${on?`
      <div class="tg"><div>Resumen diario<small>Activas, entregas de hoy y atrasadas</small></div>
        <div style="display:flex;gap:8px;align-items:center"><select id="pH">${hours.map(h=>`<option value="${h}" ${DEVICE.horaResumen==h?'selected':''}>${h}:00</option>`).join('')}</select>
        <label class="sw"><input type="checkbox" id="pR" ${DEVICE.resumen!==false?'checked':''}><i></i></label></div></div>
      <div class="tg"><div>Recordatorios<small>Inicios, entregas y avances del día; entregas de mañana a las 18:00</small></div>
        <label class="sw"><input type="checkbox" id="pE" ${DEVICE.recordatorios!==false?'checked':''}><i></i></label></div>`:''}
    </div></div>
    ${pushSupported()&&perm!=='denied'?`
      <button class="big ${on?'ghost':''}" style="margin-top:0" data-push>${ic('bell')} ${on?'Volver a registrar este dispositivo':'Activar notificaciones'}</button>
      ${on?`<button class="big ghost" style="margin-top:0" data-test>${ic('check')} Probar notificación</button>`:''}`:''}
    <div class="dcard"><div class="h">${ic('db')} Base de datos</div><div class="in" style="padding:4px 14px">
      <div class="kv"><span>Firebase</span><b>diagram-diapp</b></div>
      <div class="kv"><span>Colección</span><b>tracking-dbos</b></div>
      <div class="kv"><span>Actividades</span><b>${ACTS.length}</b></div>
    </div></div>
    <p class="note">Los avisos los envía GitHub Actions cada hora; pueden tardar unos minutos.</p>`);
  const s=$('sheet');
  s.querySelector('[data-close]').onclick=closeSheet;
  s.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{THEME=b.dataset.th;try{localStorage.setItem('tracker-theme',THEME)}catch(e){}applyTheme();s.querySelectorAll('[data-th]').forEach(x=>x.classList.toggle('on',x===b))});
  const pb=s.querySelector('[data-push]');
  if(pb)pb.onclick=async()=>{pb.disabled=true;pb.style.opacity=.6;
    try{if(await enablePush()){toast('Notificaciones activadas');openSettings()}}catch(e){toast('Error: '+(e.message||e))}
    pb.disabled=false;pb.style.opacity=1};
  const tb=s.querySelector('[data-test]');
  if(tb)tb.onclick=async()=>{try{const r=await getReg();await r.showNotification('Tracker',{body:'Así se verán tus avisos ✓',icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:'prueba'})}catch(e){toast('Error: '+(e.message||e))}};
  const pH=$('pH');if(pH)pH.onchange=()=>setPref('horaResumen',+pH.value);
  const pR=$('pR');if(pR)pR.onchange=()=>setPref('resumen',pR.checked);
  const pE=$('pE');if(pE)pE.onchange=()=>setPref('recordatorios',pE.checked);
}

/* =========================================================
   ARRANQUE
   ========================================================= */
applyTheme();
$('btnRefresh').innerHTML=ic('refresh');
$('btnCfg').innerHTML=ic('gear');
$('btnCfg').onclick=openSettings;
$('btnRefresh').onclick=()=>COL.get({source:'server'}).then(q=>{ingest(q.docs.map(d=>d.data()));render();setSync('on');toast('Actualizado')}).catch(()=>{setSync('off');toast('Sin conexión')});
setSync('busy');
render();
COL.onSnapshot({includeMetadataChanges:true},snap=>{
  ingest(snap.docs.map(d=>d.data()));
  setSync(snap.metadata.hasPendingWrites?'busy':snap.metadata.fromCache&&!navigator.onLine?'off':'on');
  if(LP&&LP.active)return; // no repintar mientras la burbuja está abierta
  render();
},err=>{setSync('off');toast('Firestore: '+err.message)});
ROOT.onSnapshot(d=>{VAPID=(d.exists&&d.data().vapidKey)||VAPID_DEFAULT},()=>{});
DEV.doc(DEVICE_ID).get().then(d=>{if(d.exists)DEVICE=d.data()}).catch(()=>{});
addEventListener('online',()=>setSync('on'));addEventListener('offline',()=>setSync('off'));
if('serviceWorker' in navigator&&location.protocol==='https:'){
  getReg().then(async reg=>{
    if(pushSupported()&&Notification.permission==='granted'){
      await new Promise(r=>setTimeout(r,1500));
      const token=await firebase.messaging().getToken({vapidKey:VAPID,serviceWorkerRegistration:reg});
      if(token&&(!DEVICE||DEVICE.token!==token)){await DEV.doc(DEVICE_ID).set({token,actualizado:TS()},{merge:true});DEVICE={...(DEVICE||{}),token}}
    }
  }).catch(()=>{});
  try{firebase.messaging().onMessage(m=>{const n=m.notification||m.data||{};toast((n.title?n.title+': ':'')+(n.body||''))})}catch(e){}
}
</script>
